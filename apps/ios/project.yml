name: Coach
options:
  bundleIdPrefix: com.georgenijo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    entitlements:
      path: Coach.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgenijo.coach
        DEVELOPMENT_TEAM: P2U3P8B923
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Coach
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~iphone: UIInterfaceOrientationPortrait
