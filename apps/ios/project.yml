name: Coach
options:
  bundleIdPrefix: com.georgenijo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

schemes:
  Coach:
    build:
      targets:
        Coach: all
        CoachTests: [test]
    run:
      config: Debug
    test:
      targets:
        - CoachTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # UIAppFonts has no INFOPLIST_KEY_* build setting, so the generated
    # Info.plist silently dropped it and every Geist font fell back to SF.
    # This partial plist is merged with the generated keys below.
    info:
      path: Info.plist
      properties:
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
    entitlements:
      path: Coach.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgenijo.coach
        DEVELOPMENT_TEAM: P2U3P8B923
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Coach
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~iphone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Coach reads your workouts, heart rate, and step counts from Health to enrich your training stats."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Coach does not write to Health; this access is declared only because the HealthKit entitlement requires it."
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgenijo.coach.tests
        DEVELOPMENT_TEAM: P2U3P8B923
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
